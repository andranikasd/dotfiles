# General settings
general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 5  # Seconds before locking
}

# Background
background {
    monitor =
    color = rgba(1a1a1aaa)  # Black with slight transparency
    blur_passes = 0  # Disable blur for minimalism
}

# Time label
label {
    monitor =
    text = cmd[update:1000] date '+%H:%M'
    color = rgb(ffffff)
    font_size = 50
    font_family = monospace
    position = 0, 50
    halign = center
    valign = center
}

# Password input field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(4a4a4a)
    inner_color = rgb(2a2a2a)
    font_color = rgb(ffffff)
    fade_on_empty = false
    placeholder_text = "<i>Enter Password</i>"
    position = 0, -20
    halign = center
    valign = center
}