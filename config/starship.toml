"$schema" = 'https://starship.rs/config-schema.json'

# ── Compact One-Line Prompt ──
# Format: user@host git:branch status → directory $ 
format = "$username$hostname$git_branch$git_status$directory $character "
add_newline = false

# ── Prompt Character ──
[character]
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'
vicmd_symbol = '[V](bold yellow)'

# ── User / Host ──
[username]
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style)@"
show_always = true

[hostname]
ssh_only = false
format = "[$hostname](bold cyan) "
trim_at = "."
disabled = false

# ── Directory ──
[directory]
truncation_length = 2
truncation_symbol = "…/"
style = "bold blue"
read_only = " "
format = "[$path]($style) "

# ── Git ──
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style)"

[git_status]
style = "bold purple"
staged = "[+](green)"
modified = "[!](yellow)"
deleted = "[✘](red)"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
format = "([$all_status$ahead_behind]($style))"

# ── Disabled modules for compactness ──
[kubernetes]
disabled = true

[cmd_duration]
min_time = 2000
format = "[⏱ $duration]($style)"
style = "bold green"

[aws]
disabled = true

[memory_usage]
disabled = true